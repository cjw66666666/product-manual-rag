[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rag-refactor"
version = "0.1.0"
description = "Product manual RAG with grounded citations."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14,<2.0",
    "argon2-cffi>=23.1,<26.0",
    "fastapi>=0.115,<1.0",
    "httpx>=0.28,<1.0",
    "itsdangerous>=2.2,<3.0",
    "langfuse>=5.0.4",
    "pydantic-settings>=2.6,<3.0",
    "pymupdf>=1.25,<2.0",
    "pymysql>=1.1,<2.0",
    "python-multipart>=0.0.20,<1.0",
    "qdrant-client>=1.12,<2.0",
    "sqlalchemy>=2.0,<3.0",
    "uvicorn[standard]>=0.32,<1.0",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.13,<2.0",
  "pytest>=8.3,<9.0",
  "pytest-cov>=6.0,<7.0",
  "ruff>=0.9,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/rag_app"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[dependency-groups]
dev = [
    "pytest-asyncio>=0.24,<1.0",
]
